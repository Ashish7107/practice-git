name: Python CI

# Trigger the workflow on any push to the main branch or pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Check out code
        uses: actions/checkout@v2

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # Step 3: Install dependencies
      # ...existing code...

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      # Step 4: Download wkhtmltopdf
      - name: Download wkhtmltopdf
        run: |
          choco install wkhtmltopdf -y
        shell: powershell

      # Step 5: Run tests and generate HTML report
      - name: Run tests and generate HTML report
        run: pytest --html=report.html

      # Step 6: Convert HTML report to PDF
      - name: Convert HTML report to PDF
        run: wkhtmltopdf report.html report.pdf

      # Step 7: Upload PDF report as artifact
      - name: Upload PDF report
        uses: actions/upload-artifact@v3
        with:
          name: test-report-pdf
          path: report.pdf